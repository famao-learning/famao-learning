<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>天净沙·秋思</title>
<style>
  html, body { margin: 0; background: #05070b; overflow: hidden; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
  canvas { position: absolute; left: 0; top: 0; display: block; }
  /* 标题和字幕用钟齐志莽行书（Zhi Mang Xing，SIL OFL 开源字体，可商用） */
  @font-face { font-family: "ZhiMangXing"; src: url(/assets/fonts/ZhiMangXing-Regular.ttf); }
  /* 艺术字幕：手写毛笔字（字大小错落、跟着旁白逐字出现）+ 红印 + 英文衬线小字 */
  #stage { --art: "ZhiMangXing", "Xingkai SC", "Kaiti SC", serif; --artw: 400; }
  .zh { display: flex; align-items: flex-end; white-space: nowrap; font-family: var(--art); font-weight: var(--artw); line-height: 1.12; color: #fcf6ea;
    text-shadow: 0 0 2px rgba(0,0,0,.9), 0 4px 12px rgba(0,0,0,.72), 0 0 42px rgba(0,0,0,.6); }
  .zh span { display: inline-block; transform-origin: 50% 78%; }
  .seal { align-self: center; margin-left: .2em; padding: .22em .14em .2em; border-radius: .12em; background: #a9261c; color: #f9eadb;
    font: 700 .25em/1.1 "Songti SC", "STSong", serif; letter-spacing: .06em; writing-mode: vertical-rl; text-shadow: none;
    box-shadow: 0 2px 10px rgba(0,0,0,.5), inset 0 0 0 1.5px rgba(249,234,219,.55); transform-origin: 50% 50%; }
  .en { font: 400 34px "Baskerville", "Times New Roman", serif; letter-spacing: .6px; color: #f4ecdf; white-space: nowrap;
    text-shadow: 0 0 2px rgba(0,0,0,.95), 0 2px 10px rgba(0,0,0,.85), 0 0 26px rgba(0,0,0,.6); }
  .en:empty { display: none; }
  #title { position: absolute; left: 128px; bottom: 96px; }
  .cue { position: absolute; left: 0; bottom: 0; opacity: 0; transform-origin: 30% 60%; }
  #title .zh { font-size: 130px; }
  #title .en { margin: 8px 0 0 8px; font-size: 36px; letter-spacing: 1.5px; }
  #shade { position: absolute; left: 0; bottom: 0; width: 100%; height: 470px; opacity: 0; pointer-events: none;
    background: radial-gradient(ellipse 1500px 470px at 380px 100%, rgba(6,5,8,.62), rgba(6,5,8,.3) 55%, transparent 80%),
                linear-gradient(to top, rgba(6,5,8,.8), rgba(6,5,8,.46) 38%, rgba(6,5,8,.12) 72%, transparent); }
  #sub { position: absolute; left: 128px; bottom: 92px; }
  #sub .zh { font-size: 114px; }
  #sub .en { margin: 8px 0 0 6px; font-size: 36px; }
  /* 3:4 竖版（1080×1440） */
  .f34 #title, .f34 #sub { left: 64px; bottom: 118px; }
  .f34 #title .zh { font-size: 140px; }
  .f34 #sub .zh { font-size: 132px; }
  .f34 #title .en, .f34 #sub .en { font-size: 38px; margin-top: 10px; }
  .f34 #shade { height: 560px;
    background: radial-gradient(ellipse 1100px 520px at 300px 100%, rgba(6,5,8,.62), rgba(6,5,8,.3) 55%, transparent 82%),
                linear-gradient(to top, rgba(6,5,8,.95), rgba(6,5,8,.88) 28%, rgba(6,5,8,.55) 52%, rgba(6,5,8,.16) 78%, transparent); }
  #credit {
    position: absolute; right: 150px; bottom: 96px; font: 500 38px "Songti SC", "STSong", serif; letter-spacing: 4px;
    color: #3a332c; opacity: 0;
  }
</style>
<script type="importmap">
{ "imports": {
    "three": "/node_modules/three/build/three.module.js",
    "three/addons/": "/node_modules/three/examples/jsm/"
} }
</script>
</head>
<body>
<div id="stage">
  <canvas id="c" width="1920" height="1080"></canvas>
  <div id="shade"></div>
  <svg id="inkDefs" width="0" height="0" style="position:absolute"></svg>
  <div id="title"><div class="cue"><div class="zh" id="titleZh"></div><div class="en" id="titleEn"></div></div></div>
  <div id="sub"></div>
  <div id="credit"></div>
</div>
<script type="module" src="./main.js"></script>
</body>
</html>
